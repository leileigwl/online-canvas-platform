[project]
name = "canvas-api"
version = "0.1.0"
description = "FlowCanvas API and shared backend domain models"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "arq>=0.26.3,<1",
  "redis>=5.2,<7",
  "boto3>=1.37,<2",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canvas_api"]

[tool.ruff]
line-length = 100
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
